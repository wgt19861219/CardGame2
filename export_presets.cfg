; 主项目 Android debug 快包预设（2026-09-29 立）。
; 注意：主项目 project.godot 按 2026-09-18 定案不开 import_etc2_astc（开发期无损纹理），
; 直接导 Android 前需临时补 textures/vram_compression/import_etc2_astc=true 并重导入，导完回滚。
; 正式发布（加密+release 签名+图标）走 D:\godot-custom\export-all.sh --sync 隔离副本链，勿用本预设。

[preset.0]

